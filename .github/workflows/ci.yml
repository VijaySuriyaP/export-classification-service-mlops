name: CI

# unit  - pytest (no Docker needed)
# stack - builds every image, starts the whole Compose stack from a clean checkout, waits for the
#         health checks, runs scripts/smoke_test.py, then scales agent-worker to 3 and runs it again.
#         This is the "docker compose up from a clean clone" check (demo item 1) and the --scale check (A7).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: python -m pytest

  stack:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the template (fast stub, short breaker timers)
        run: |
          cp .env.example .env
          set_env() { sed -i "s|^$1=.*|$1=$2|" .env; grep -q "^$1=$2$" .env; }
          set_env STUB_LATENCY_MS 150
          set_env STUB_LATENCY_JITTER_MS 50
          set_env LLM_MAX_ATTEMPTS 2
          set_env LLM_BACKOFF_BASE_S 0.2
          set_env LLM_BACKOFF_MAX_S 1
          set_env CB_FAILURE_THRESHOLD 3
          set_env CB_RESET_TIMEOUT_S 5

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Build and start the stack (single command, waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Service status
        run: |
          mkdir -p evidence
          docker compose ps | tee evidence/compose-ps-1-worker.txt

      - name: Smoke test - 1 worker (all checks)
        run: python scripts/smoke_test.py --wait 120 --label 1-worker | tee evidence/smoke-1-worker.txt

      - name: Scale agent-worker to 3
        run: |
          docker compose up -d --scale agent-worker=3 --no-recreate --wait --wait-timeout 180
          docker compose ps | tee evidence/compose-ps-3-workers.txt

      - name: Smoke test - 3 workers (run, breaker, scale)
        run: python scripts/smoke_test.py --only run,web,feedback,breaker,scale --expect-workers 3 --label 3-workers | tee evidence/smoke-3-workers.txt

      - name: Resource snapshot
        if: always()
        run: docker stats --no-stream | tee evidence/docker-stats.txt

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps > evidence/compose-logs.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stack-evidence
          path: evidence/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### Compose stack smoke test"
            for f in evidence/smoke-*.txt; do
              [ -f "$f" ] && { echo "**$(basename "$f")**"; echo '```'; cat "$f"; echo '```'; }
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down
        if: always()
        run: docker compose down -v
