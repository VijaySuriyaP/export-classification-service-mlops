# Test-only overlay. Production agent code and prompts are unchanged.
services:
  agent-worker:
    environment:
      AGENT_RUNNER: app.agents.classification_runner:ClassificationRunner
      RETRIEVAL_TOOL: app.retrieval.tool:search
      LLM_BASE_URL: http://llm-stub:8001/v1
      LLM_FALLBACK_BASE_URL: ""
      RUN_CACHE_TTL_SECONDS: ${TEST_CACHE_TTL:-0}
    volumes:
      - ./scripts:/srv/scripts:ro
      - ./loadtest/fixtures:/srv/loadtest-fixtures
  llm-stub:
    environment:
      STUB_RESPONSES_FILE: /srv/loadtest-fixtures/responses.json
    volumes:
      - ./loadtest/fixtures:/srv/loadtest-fixtures:ro
  locust:
    environment:
      LOADTEST_DESCRIPTION: Stainless steel vacuum flask with a moulded plastic outer body.
